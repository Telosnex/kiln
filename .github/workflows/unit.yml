name: Unit

on:
  pull_request:
    branches: [main]
  push:
    # ci/** branches run it too: a new workflow cannot be started by hand
    # before it is on main.
    branches: [main, 'ci/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: unit-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  unit:
    name: Unit
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: Telosnex/telosnex_ci_tools/actions/setup-flutter@fd2f9876ef2384fc7841cccd64049f7f5c387c18 # v0.5.13
      - uses: Telosnex/telosnex_ci_tools/actions/lint@fd2f9876ef2384fc7841cccd64049f7f5c387c18 # v0.5.13
      - run: dart pub get
      - run: dart format --output=none --set-exit-if-changed bin lib test
      # Not --fatal-infos: kiln calls targetVersion, deprecated in
      # code_assets 2.2. Its replacement needs code_assets >= 2.2, and kiln
      # supports >= 1.0.0.
      - run: dart analyze bin lib test
      - run: dart test -r expanded

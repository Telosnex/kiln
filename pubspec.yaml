name: native_prebuilt
description: Prebuilt native libraries for Dart build hooks, built by the same hook code that builds from source. See docs/ADR_001_PREBUILT_NATIVE_LIBRARIES.md.
version: 0.1.0
publish_to: none
repository: https://github.com/Telosnex/native_prebuilt

environment:
  sdk: ^3.10.0

dependencies:
  archive: ^4.0.9
  args: ^2.7.0
  code_assets: ">=1.0.0 <3.0.0"
  crypto: ^3.0.6
  hooks: ">=1.0.1 <3.0.0"
  logging: ^1.2.0
  path: ^1.9.0

dev_dependencies:
  test: ^1.26.0
